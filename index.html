<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Financeiro PWA</title>
  
  <!-- PWA Manifest & Theme -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#4F46E5">
  <link rel="apple-touch-icon" href="icon.png">

  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans flex flex-col">

  <!-- Header -->
  <header class="bg-slate-800 border-b border-slate-700 px-6 py-4 flex flex-wrap justify-between items-center gap-4">
    <div class="flex items-center gap-3">
      <div class="bg-indigo-600 p-2 rounded-lg">
        <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/>
        </svg>
      </div>
      <h1 class="text-xl font-bold tracking-wide">DevDashboard</h1>
    </div>

    <!-- Relógio Sincronizado -->
    <div class="bg-slate-900 px-4 py-2 rounded-md border border-slate-700 flex items-center gap-2">
      <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
      <span id="clock" class="font-mono text-sm font-medium text-emerald-400">00:00:00</span>
    </div>
  </header>

  <!-- Main Content -->
  <main class="flex-1 max-w-7xl w-full mx-auto p-6 space-y-6">

    <!-- Metrics Cards -->
    <section class="grid grid-cols-1 md:grid-cols-3 gap-6">
      <div class="bg-slate-800 p-5 rounded-xl border border-slate-700">
        <p class="text-slate-400 text-sm font-medium">Volume Total</p>
        <p class="text-2xl font-bold mt-1 text-white">R$ 128.450,00</p>
      </div>
      <div class="bg-slate-800 p-5 rounded-xl border border-slate-700">
        <p class="text-slate-400 text-sm font-medium">Operações (Ativas)</p>
        <p id="total-ops" class="text-2xl font-bold mt-1 text-indigo-400">0</p>
      </div>
      <div class="bg-slate-800 p-5 rounded-xl border border-slate-700">
        <p class="text-slate-400 text-sm font-medium">Status do PWA</p>
        <p id="pwa-status" class="text-2xl font-bold mt-1 text-emerald-400">Pronto</p>
      </div>
    </section>

    <!-- Table Section -->
    <section class="bg-slate-800 rounded-xl border border-slate-700 overflow-hidden">
      <div class="p-5 border-b border-slate-700 flex justify-between items-center">
        <h2 class="text-lg font-semibold">Lista de Operações Recentes</h2>
        <button id="btn-generate" class="bg-indigo-600 hover:bg-indigo-500 text-white text-sm px-4 py-2 rounded-lg font-medium transition">
          Simular Novas Cargas
        </button>
      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="bg-slate-900/50 text-slate-400 text-xs uppercase tracking-wider">
              <th class="p-4">ID Operação</th>
              <th class="p-4">Produto</th>
              <th class="p-4">Valor</th>
              <th class="p-4">Status</th>
              <th class="p-4">Carimbo de Hora</th>
            </tr>
          </thead>
          <tbody id="table-body" class="divide-y divide-slate-700 text-sm">
            <!-- As linhas serão inseridas dinamicamente via JS -->
          </tbody>
        </table>
      </div>
    </section>

  </main>

  <!-- Script da Aplicação -->
  <script>
    // 1. Relógio Sincronizado com o Sistema Local (Desktop)
    function updateClock() {
      const now = new Date();
      const timeString = now.toLocaleTimeString('pt-BR', { hour12: false });
      document.getElementById('clock').textContent = timeString;
    }
    setInterval(updateClock, 1000);
    updateClock();

    // 2. Gerador de Dados para Treinamento de Interface
    const products = ['Assinatura PRO', 'Plano Enterprise', 'Crédito de API', 'Licença Anual'];
    const statuses = ['Concluído', 'Pendente', 'Cancelado'];

    function generateMockData(count = 50) {
      const rows = [];
      const tbody = document.getElementById('table-body');
      tbody.innerHTML = '';

      for (let i = 0; i < count; i++) {
        const id = 'OP-' + Math.floor(100000 + Math.random() * 900000);
        const prod = products[Math.floor(Math.random() * products.length)];
        const amount = (Math.random() * 500 + 10).toFixed(2);
        const status = statuses[Math.floor(Math.random() * statuses.length)];
        const date = new Date().toLocaleDateString('pt-BR');

        let statusColor = 'text-emerald-400 bg-emerald-500/10';
        if (status === 'Pendente') statusColor = 'text-amber-400 bg-amber-500/10';
        if (status === 'Cancelado') statusColor = 'text-rose-400 bg-rose-500/10';

        tbody.innerHTML += `
          <tr class="hover:bg-slate-700/50 transition">
            <td class="p-4 font-mono text-slate-300">${id}</td>
            <td class="p-4 font-medium text-white">${prod}</td>
            <td class="p-4">R$ ${amount}</td>
            <td class="p-4">
              <span class="px-2.5 py-1 rounded-full text-xs font-medium ${statusColor}">
                ${status}
              </span>
            </td>
            <td class="p-4 text-slate-400">${date}</td>
          </tr>
        `;
      }
      document.getElementById('total-ops').textContent = count;
    }

    document.getElementById('btn-generate').addEventListener('click', () => generateMockData(100));
    generateMockData(20);

    // 3. Registro do Service Worker (PWA)
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('SW registrado com sucesso:', reg.scope))
          .catch(err => console.log('Falha ao registrar SW:', err));
      });
    }
  </script>
</body>
</html>
